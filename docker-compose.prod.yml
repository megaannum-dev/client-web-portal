services:
  caddy:
    image: caddy:2
    container_name: portal-caddy
    restart: unless-stopped
    depends_on:
      - admin-frontend
      - client-frontend
      - api-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
