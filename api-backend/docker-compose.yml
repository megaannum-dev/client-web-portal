services:
  mariadb:
    image: mariadb:11.4
    container_name: portal-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootsecret}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-portal}
      MARIADB_USER: ${MARIADB_USER:-portal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-portalsecret}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-portal}:${MARIADB_PASSWORD:-portalsecret}@mariadb:3306/${MARIADB_DATABASE:-portal}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-client-web-portal-2026}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/secrets/firebase.json}
      FIREBASE_AUTH_DISABLED: ${FIREBASE_AUTH_DISABLED:-false}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Super Admin}
      DEV_MODE: ${DEV_MODE:-false}
      PC_PERIOD_OPEN_DAYS_BEFORE_END: ${PC_PERIOD_OPEN_DAYS_BEFORE_END:-9}
      STORAGE_ROOT: /app/crm_filesystem
      IB_FLEX_TRANSPORT: ${IB_FLEX_TRANSPORT:-drop}
      IB_FLEX_DROP_ROOT: /srv/mega-crm-ib-flex
      IB_FLEX_TOKEN: ${IB_FLEX_TOKEN:-}
      IB_FLEX_QUERY_ID: ${IB_FLEX_QUERY_ID:-}
      IB_FLEX_CACHE_TTL_SECONDS: ${IB_FLEX_CACHE_TTL_SECONDS:-900}
    volumes:
      - ./firebase-client-web-portal.json:/secrets/firebase.json:ro
      - ./crm_filesystem:/app/crm_filesystem
      # Host dir -> container dir. Two DIFFERENT variables on purpose:
      # IB_FLEX_HOST_DIR is read by Compose on the host (from .env) and is a
      # host path; IB_FLEX_DROP_ROOT above is read by the app INSIDE the
      # container and is the container path. Reusing one name for both made
      # editing .env silently change only the mount source. Read-only: see
      # DropFetcher in app/core/ib_flex.py -- it never writes.
      - ${IB_FLEX_HOST_DIR:?set IB_FLEX_HOST_DIR in api-backend/.env to the host IB Flex drop directory}:/srv/mega-crm-ib-flex:ro
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  mariadb_data:
